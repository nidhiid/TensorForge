[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorforge-compiler"
version = "0.1.0"
description = "PyTorch frontend for the TensorForge MLIR compiler prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
